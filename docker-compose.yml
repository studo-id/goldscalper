name: goldscalper

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gs-timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goldscalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-goldscalper}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - gs-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldscalper} -d ${POSTGRES_DB:-goldscalper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gs-net

  redis:
    image: redis:7-alpine
    container_name: gs-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - gs-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gs-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldscalper:latest
    container_name: gs-bot
    restart: always
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "9090"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6380"
    ports:
      - "9090:9090"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./frontend:/app/frontend
      - ./config:/app/config
      - ./core:/app/core
      - ./agents:/app/agents
      - ./execution:/app/execution
      - ./spk:/app/spk
      - ./runtime.py:/app/runtime.py
    networks:
      - gs-net
      - aceng-net

  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: gs-mt5
    restart: always
    environment:
      CUSTOM_USER: studo
      PASSWORD: "12qwAS!!"
    ports:
      - "9096:3000"
      - "8001:8001"
    volumes:
      - gs-mt5-data:/config
    networks:
      - gs-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gs-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - bot
    networks:
      - gs-net
    profiles:
      - tunnel

volumes:
  gs-timescale-data:
    name: gs-timescale-data
  gs-redis-data:
    name: gs-redis-data
  gs-mt5-data:
    name: gs-mt5-data

networks:
  gs-net:
    name: gs-net
  aceng-net:
    external: true
