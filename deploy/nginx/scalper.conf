# GoldScalper — internal reverse proxy (optional)
#
# Only needed if you front the bot with Nginx inside the gs-net network
# instead of pointing Cloudflare Tunnel straight at `bot:9090`. Proxy headers
# include WebSocket upgrade handling for /ws/telemetry.
#
# Mount target in a compose service:
#   ./deploy/nginx:/etc/nginx/conf.d:ro

upstream goldscalper_bot {
    server bot:9090;
    keepalive 16;
}

server {
    listen 9080;
    server_name scalper.7pivot.site;

    client_max_body_size 4m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://goldscalper_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # WebSocket telemetry
    location /ws/ {
        proxy_pass http://goldscalper_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health (unauthenticated, no cache)
    location = /health {
        proxy_pass http://goldscalper_bot/health;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
}
